[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# The IMD launch verifier rebuilds with this toolchain; keep it pinned.
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# Every top-level call in a test is its own transaction, as on chain: transient storage (the
# one-ask-per-transaction guard) resets between them.
isolate = true
# Mainnet-fork tests run under FOUNDRY_PROFILE=fork.
no_match_path = "test/fork/**"
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "./launch" }]

[profile.default.fuzz]
runs = 2000

[profile.default.invariant]
runs = 256
depth = 80
fail_on_revert = true

# The local devnet script writes deployments/devnet.json; the IMD swarm's workers refuse write access in the default
# profile, so it lives here: FOUNDRY_PROFILE=devnet (devnet/start.sh sets it).
[profile.devnet]
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./launch" }]

[profile.fork]
match_path = "test/fork/**"
no_match_path = "test/invariant/**"

[profile.deep.fuzz]
runs = 20000

[profile.deep.invariant]
runs = 1000
depth = 150
fail_on_revert = true

[fmt]
line_length = 120
# the vendored IMD Intake stays byte-for-byte as verified on chain
ignore = ["test/external/**"]
